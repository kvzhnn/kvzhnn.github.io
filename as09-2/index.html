<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下背痛潛在風險檢測</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
        }
        .checkbox-wrapper input:checked + div {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .checkbox-wrapper input:checked + div .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        /* Result Animation */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="text-gray-700">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg">
        <div class="max-w-3xl mx-auto px-6 py-10 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">小測驗：你有以下習慣嗎？</h1>
            <p class="text-lg md:text-xl font-light opacity-90">勾選之後.... 你可能也是潛在的下背痛患者哦～</p>
            <p class="mt-4 text-sm bg-white/20 inline-block px-4 py-2 rounded-full backdrop-blur-sm">
                容易造成下背痛的原因主要與姿勢不良、過度負重或特定的生活習慣有關。
            </p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8 pb-24">
        
        <form id="quizForm" onsubmit="calculateResult(event)">
            
            <!-- Section 1: Posture -->
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 mr-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">姿勢與動作習慣</h2>
                </div>

                <div class="space-y-4">
                    <!-- Q1 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">1. 長時間久坐或久站</h3>
                                <p class="text-sm text-gray-500 mt-1">工作或休息時，經常維持同一姿勢很久，很少起來活動。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q2 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">2. 坐姿不良</h3>
                                <p class="text-sm text-gray-500 mt-1">坐著時習慣癱在椅子上、身體歪斜，或讓腰椎懸空。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q3 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">3. 習慣性駝背</h3>
                                <p class="text-sm text-gray-500 mt-1">站立或坐著時，背部無法自然挺直。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q4 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">4. 經常彎腰</h3>
                                <p class="text-sm text-gray-500 mt-1">常常彎腰工作，或習慣直接彎腰撿東西（而非蹲下）。</p>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Section 2: Load -->
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 mr-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">負重與勞動狀況</h2>
                </div>

                <div class="space-y-4">
                    <!-- Q5 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">5. 搬運重物姿勢錯誤</h3>
                                <p class="text-sm text-gray-500 mt-1">搬東西時不顧姿勢硬搬，或直接用腰部的力量拉起重物。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q6 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">6. 身上負重過重</h3>
                                <p class="text-sm text-gray-500 mt-1">外出時包包太重，或工作時身上需背負重物。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q7 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">7. 過度勞累</h3>
                                <p class="text-sm text-gray-500 mt-1">感覺身體長期疲勞，休息後仍無法緩解，腰部有勞損感。</p>
                            </div>
                        </div>
                    </label>

                     <!-- Q8 -->
                     <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">8. 曾有外傷紀錄</h3>
                                <p class="text-sm text-gray-500 mt-1">腰部曾經受過閃挫、撞擊或跌倒損傷。</p>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Section 3: Lifestyle -->
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 mr-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">身體狀況與生活型態</h2>
                </div>

                <div class="space-y-4">
                    <!-- Q9 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">9. 缺乏規律運動</h3>
                                <p class="text-sm text-gray-500 mt-1">平常沒有運動習慣，核心肌群較無力。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q10 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">10. 體重過重</h3>
                                <p class="text-sm text-gray-500 mt-1">有肥胖問題，導致脊椎承受較大壓力。</p>
                            </div>
                        </div>
                    </label>

                    <!-- Q11 -->
                    <label class="checkbox-wrapper cursor-pointer block group">
                        <input type="checkbox" name="habit" value="1" class="hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 transition-all duration-200 hover:border-blue-300 flex items-start">
                            <div class="flex-shrink-0 mt-1 mr-3 w-6 h-6 border-2 border-gray-300 rounded flex items-center justify-center bg-white group-hover:border-blue-400">
                                <svg class="check-icon w-4 h-4 text-blue-600 opacity-0 transform scale-50 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">11. 有抽菸習慣</h3>
                                <p class="text-sm text-gray-500 mt-1">長期抽菸（尼古丁會影響血液循環，加速關節退化）。</p>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Action Button -->
            <div class="text-center">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full text-lg shadow-lg transform transition hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    查看檢測結果
                </button>
            </div>
        </form>

        <!-- Result Section (Hidden by default) -->
        <div id="resultSection" class="hidden mt-10">
            <!-- Dynamic Content will be injected here -->
        </div>

    </main>

    <footer class="bg-gray-800 text-gray-400 py-6 text-center text-sm">
        <p>本測驗僅供參考，若有身體不適請務必尋求專業醫師診斷。</p>
    </footer>

    <script>
        function calculateResult(e) {
            e.preventDefault();
            
            // Count checked boxes
            const checkedCount = document.querySelectorAll('input[name="habit"]:checked').length;
            const resultSection = document.getElementById('resultSection');
            
            let htmlContent = '';
            
            // Logic based on requirements
            if (checkedCount <= 2) {
                // Low Risk (0-2)
                htmlContent = `
                    <div class="fade-in-up bg-green-50 border-l-8 border-green-500 rounded-r-xl shadow-lg p-8">
                        <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-4">
                            <div>
                                <span class="text-green-600 font-bold uppercase tracking-wide text-sm">檢測結果</span>
                                <h2 class="text-3xl font-bold text-gray-800 mt-1">恭喜！狀況良好</h2>
                            </div>
                            <div class="mt-4 md:mt-0 bg-green-200 text-green-800 px-4 py-2 rounded-full font-bold">
                                勾選 ${checkedCount} 項
                            </div>
                        </div>
                        <p class="text-gray-700 text-lg leading-relaxed mb-4">
                            目前的習慣大致良好。請繼續保持！
                        </p>
                        <div class="bg-white p-4 rounded-lg border border-green-100">
                             <h4 class="font-bold text-green-700 mb-2">💡行動建議</h4>
                             <p class="text-gray-600">多嘗試不同類型的運動，除了重訓以外，也可以去游泳、爬山、騎車，讓身體有不同的動作模式，肌肉才有「容錯空間」！</p>
                        </div>
                        
                        <div class="mt-8 text-center border-t border-green-100 pt-6">
                            <button onclick="resetQuiz()" class="inline-flex items-center px-6 py-2 bg-white text-green-600 border border-green-300 rounded-full hover:bg-green-50 transition-colors font-medium shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                                重新測驗
                            </button>
                        </div>
                    </div>
                `;
            } else if (checkedCount <= 5) {
                // Medium Risk (3-5)
                htmlContent = `
                    <div class="fade-in-up bg-yellow-50 border-l-8 border-yellow-500 rounded-r-xl shadow-lg p-8">
                        <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-4">
                            <div>
                                <span class="text-yellow-600 font-bold uppercase tracking-wide text-sm">檢測結果</span>
                                <h2 class="text-3xl font-bold text-gray-800 mt-1">注意！風險因子偏多</h2>
                            </div>
                            <div class="mt-4 md:mt-0 bg-yellow-200 text-yellow-800 px-4 py-2 rounded-full font-bold">
                                勾選 ${checkedCount} 項
                            </div>
                        </div>
                        <p class="text-gray-700 text-lg leading-relaxed mb-6">
                            您已有多項容易導致下背痛的風險因子。建議開始針對勾選的項目進行改善。
                        </p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-white p-4 rounded-lg shadow-sm border border-yellow-100">
                                <h4 class="font-bold text-gray-800 mb-2">🚶 定時活動</h4>
                                <p class="text-sm text-gray-600">多多變換姿勢，每坐一小時就起來走動！</p>
                            </div>
                            <div class="bg-white p-4 rounded-lg shadow-sm border border-yellow-100">
                                <h4 class="font-bold text-gray-800 mb-2">🎒 規律運動</h4>
                                <p class="text-sm text-gray-600">即使只是每天快走 15-30 分鐘，對於壓力的調節，也是一個很好的幫助喔！</p>
                            </div>
                        </div>

                        <div class="mt-8 text-center border-t border-yellow-100 pt-6">
                            <button onclick="resetQuiz()" class="inline-flex items-center px-6 py-2 bg-white text-yellow-600 border border-yellow-300 rounded-full hover:bg-yellow-50 transition-colors font-medium shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                                重新測驗
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // High Risk (6+)
                htmlContent = `
                    <div class="fade-in-up bg-red-50 border-l-8 border-red-500 rounded-r-xl shadow-lg p-8">
                        <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-4">
                            <div>
                                <span class="text-red-600 font-bold uppercase tracking-wide text-sm">檢測結果</span>
                                <h2 class="text-3xl font-bold text-gray-800 mt-1">警報！下背痛高危險群</h2>
                            </div>
                            <div class="mt-4 md:mt-0 bg-red-200 text-red-800 px-4 py-2 rounded-full font-bold">
                                勾選 ${checkedCount} 項
                            </div>
                        </div>
                        <p class="text-gray-700 text-lg leading-relaxed mb-6">
                            您的脊椎正處於<span class="font-bold text-red-600">高壓環境</span>，非常容易發生下背痛、椎間盤突出或肌肉拉傷。請立即採取行動！
                        </p>
                        
                        <div class="bg-white rounded-lg border border-red-100 overflow-hidden">
                            <div class="bg-red-100 px-4 py-2 font-bold text-red-800">建議行動清單</div>
                            <ul class="divide-y divide-gray-100">
                                <li class="p-4 flex items-start">
                                    <span class="text-red-500 mr-3 text-xl">💪</span>
                                    <div>
                                        <strong class="text-gray-800 block">規律運動</strong>
                                        <span class="text-sm text-gray-600">即使只是每天快走 15-30 分鐘，對於壓力的調節，也是一個很好的幫助喔！</span>
                                    </div>
                                </li>
                                <li class="p-4 flex items-start">
                                    <span class="text-red-500 mr-3 text-xl">🥗</span>
                                    <div>
                                        <strong class="text-gray-800 block">調整生活型態</strong>
                                        <span class="text-sm text-gray-600">戒菸、控制體重，並且充足睡眠。睡眠對免疫系統和壓力調節很重要！</span>
                                    </div>
                                </li>
                                <li class="p-4 flex items-start">
                                    <span class="text-red-500 mr-3 text-xl">🏥</span>
                                    <div>
                                        <strong class="text-gray-800 block">專業協助</strong>
                                        <span class="text-sm text-gray-600">若已有疼痛症狀，請勿拖延，尋求醫師協助。</span>
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <div class="mt-8 text-center border-t border-red-100 pt-6">
                            <button onclick="resetQuiz()" class="inline-flex items-center px-6 py-2 bg-white text-red-600 border border-red-300 rounded-full hover:bg-red-50 transition-colors font-medium shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                                重新測驗
                            </button>
                        </div>
                    </div>
                `;
            }

            // Render result
            resultSection.innerHTML = htmlContent;
            resultSection.classList.remove('hidden');

            // Scroll to result
            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function resetQuiz() {
            // Reset the form
            document.getElementById('quizForm').reset();
            
            // Hide result section
            document.getElementById('resultSection').classList.add('hidden');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
