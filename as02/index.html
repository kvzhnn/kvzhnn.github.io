<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中職用語整理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      color: #212529;
    }
    .banner {
      background-color: #343a40;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
    .content-section {
      background-color: #e9ecef;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 8px;
    }
    h2 {
      margin-bottom: 1rem;
      color: #343a40;
    }
    table {
      background-color: #fff;
    }
  </style>
</head>
<body>
  <!-- 頁首 Banner -->
  <div class="banner">
    <h1>中職用語整理</h1>
  </div>

  <div class="container">
    <!-- 暱稱系列 -->
    <div class="content-section">
      <h2>暱稱系列</h2>
      <table class="table table-striped table-bordered">
        <tr><td>中職球迷</td></tr>
        <tr><td>爪爪</td></tr>
        <tr><td>喵喵</td></tr>
        <tr><td>吱吱</td></tr>
        <tr><td>邦邦</td></tr>
        <tr><td>啾啾</td></tr>
        <tr><td>龍龍</td></tr>
      </table>
    </div>

    <!-- 中職球員相關 -->
    <div class="content-section">
      <h2>中職球員相關</h2>
      <table class="table table-striped table-bordered">
        <tr><td>兄弟</td></tr>
        <tr><td>富邦</td></tr>
        <tr><td>樂天</td></tr>
        <tr><td>味全</td></tr>
        <tr><td>台鋼</td></tr>
        <tr><td>統一</td></tr>
      </table>
    </div>

    <!-- 中職教練、球團人員相關 -->
    <div class="content-section">
      <h2>中職教練、球團人員相關</h2>
      <table class="table table-striped table-bordered">
        <tr><td>比賽術語</td></tr>
        <tr><td>紀錄相關</td></tr>
        <tr><td>魯閣</td></tr>
        <tr><td>中＿日</td></tr>
        <tr><td>陽春彈</td></tr>
        <tr><td>滿貫彈</td></tr>
        <tr><td>背靠背</td></tr>
        <tr><td>劇場</td></tr>
        <tr><td>鍋貼</td></tr>
        <tr><td>敬遠</td></tr>
        <tr><td>問天</td></tr>
      </table>
    </div>

    <!-- 場上相關 -->
    <div class="content-section">
      <h2>場上相關</h2>
      <table class="table table-striped table-bordered">
        <tr><td>歐把</td></tr>
        <tr><td>炸裂</td></tr>
        <tr><td>車布邊</td></tr>
        <tr><td>煮粥</td></tr>
        <tr><td>拿香</td></tr>
        <tr><td>電風扇</td></tr>
        <tr><td>曼斗</td></tr>
        <tr><td>雷射肩</td></tr>
        <tr><td>德州安打／三不管地帶</td></tr>
        <tr><td>點球</td></tr>
      </table>
    </div>

    <!-- 棒球術語與數據 -->
    <div class="content-section">
      <h2>棒球術語與數據</h2>
      <h4>投球</h4>
      <table class="table table-striped table-bordered">
        <tr><td>防禦率</td></tr>
        <tr><td>whip</td></tr>
        <tr><td>完封／完投／無安打／完全比賽</td></tr>
      </table>
      <h4>打擊</h4>
      <table class="table table-striped table-bordered">
        <tr><td>打擊三圍</td></tr>
        <tr><td>打擊率</td></tr>
        <tr><td>上壘率</td></tr>
        <tr><td>長打率</td></tr>
        <tr><td>OPS</td></tr>
        <tr><td>打數／打席</td></tr>
        <tr><td>打點</td></tr>
      </table>
      <h4>跑壘</h4>
      <table class="table table-striped table-bordered">
        <tr><td>盜壘</td></tr>
        <tr><td>盜壘刺</td></tr>
      </table>
      <h4>守備</h4>
      <table class="table table-striped table-bordered">
        <tr><td>雙殺</td></tr>
        <tr><td>三殺</td></tr>
        <tr><td>野手選擇</td></tr>
        <tr><td>失誤</td></tr>
      </table>
    </div>
  </div>
</body>
</html>
